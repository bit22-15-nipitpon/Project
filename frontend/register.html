<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="alert d-none" id="error"></div>

            <div class="d-flex justify-content-end">
                <i role="button" id="back">&times;</i>
            </div>

            <h2>Register</h2>

            <form id="register">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username">
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                </div>

                <div>
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                </div>

                <div>
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel">
                </div>

                <div>
                    <button type="submit" id="registerBtn">Register</button>
                    <p>Already have an account? <a href="login">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("back").addEventListener("click", () => {
            window.location.href = "index";
        });

        const registerForm = document.getElementById("register");
        const error = document.getElementById("error");

        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            error.classList.add("d-none");

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            if (!username) {
                error.textContent = "Username is required.";
                error.classList.remove("d-none");
                return;
            }

            if (!password) {
                error.textContent = "Password is required.";
                error.classList.remove("d-none");
                return;
            }

            if (!email) {
                error.textContent = "Email is required.";
                error.classList.remove("d-none");
                return;
            }

            if (!phone) {
                error.textContent = "Phone is required.";
                error.classList.remove("d-none");
                return;
            }

            if (password !== confirmPassword) {
                error.textContent = "Passwords do not match.";
                error.classList.remove("d-none");
                return;
            }

            const formData = new FormData();
            formData.append("username", username);
            formData.append("password", password);
            formData.append("email", email);
            formData.append("phone", phone);

            try {
                const response = await fetch("http://127.0.0.1/project/api/register", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = "login";
                    localStorage.setItem("role", result.data.user.role);
                    localStorage.setItem("user_id", result.data.user.id);
                } else {
                    error.textContent = result.message;
                    error.classList.remove("d-none");
                }

            } catch (err) {
                console.error(err);
                error.textContent = "Unable to connect to the server.";
                error.classList.remove("d-none");
            }
        });
    </script>
</body>

</html>
